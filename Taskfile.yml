version: "3"

tasks:
  deps:
    desc: Install system packages required to build bterm (Debian/Ubuntu)
    cmds:
      - sudo apt update
      - >-
        sudo apt install -y
        libgtk-4-dev
        libvte-2.91-gtk4-dev
        libgirepository1.0-dev
        upx

  generate-icons:
    desc: Generate embedded GTK icon resources
    sources:
      - internal/assets/icons.gresource.xml
      - internal/assets/split-left-right.svg
      - internal/assets/split-top-bottom.svg
    generates:
      - internal/assets/icons.gresource
    cmds:
      - go generate ./internal/assets

  compile-commands:
    desc: Generate compile_commands.json so clangd (Zed) can resolve VTE/GTK headers in C files
    sources:
      - internal/terminal/vte/vte_bridge.c
    generates:
      - compile_commands.json
    cmds:
      - |
        set -e
        jq -n --arg dir "$PWD" --arg file internal/terminal/vte/vte_bridge.c \
          --arg flags "$(pkg-config --cflags vte-2.91-gtk4)" \
          '[{directory: $dir, file: $file, arguments: (["cc", "-c", $file] + ($flags | split(" ") | map(select(. != ""))))}]' \
          > compile_commands.json

  build:
    desc: Build bterm binary
    vars:
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null || echo "dev"
    cmds:
      - go build -ldflags "-X github.com/abunjevac/bterm/internal/version.Version={{.VERSION}}" -o bterm ./cmd/bterm

  pack:
    desc: Package bterm binary with upx
    cmds:
      - upx -6 -q bterm

  run:
    desc: Build and run bterm
    cmds:
      - task: build
      - ./bterm

  lint:
    desc: Run golangci-lint and go vet
    cmds:
      - golangci-lint run --allow-parallel-runners --timeout 5m
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test -count=1 ./...

  scan:
    desc: Run osv-scanner for dependency vulnerabilities
    cmds:
      - osv-scanner -r .

  check:
    desc: Full quality gate — lint + test + scan
    cmds:
      - task: lint
      - task: test
      - task: scan

  install:
    desc: Build bterm, pack it with upx and install to ~/.local/bin
    cmds:
      - task: build
      - task: pack
      - mkdir -p ~/.local/bin
      - mv bterm ~/.local/bin/bterm

  install-desktop:
    desc: Install desktop launcher and app icon for the current user
    cmds:
      - mkdir -p ~/.local/share/icons/hicolor/512x512/apps ~/.local/share/applications
      - cp internal/assets/io.github.abunjevac.bterm.png ~/.local/share/icons/hicolor/512x512/apps/io.github.abunjevac.bterm.png
      - cp internal/assets/io.github.abunjevac.bterm.desktop ~/.local/share/applications/io.github.abunjevac.bterm.desktop
      - update-desktop-database ~/.local/share/applications
      - gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor

  uninstall-desktop:
    desc: Remove desktop launcher and app icon for the current user
    cmds:
      - rm -f ~/.local/share/icons/hicolor/512x512/apps/io.github.abunjevac.bterm.png
      - rm -f ~/.local/share/applications/io.github.abunjevac.bterm.desktop
      - update-desktop-database ~/.local/share/applications
      - gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  changelog:
    desc: Generate CHANGELOG.md from git history (installs git-chglog)
    cmds:
      - go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest
      - git-chglog -o CHANGELOG.md

  prepare-release:
    desc: Generate the changelog, commit it, and tag the release (VERSION=0.2.0)
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: "{{.VERSION}}"
    cmds:
      - |
        set -e
        tag="v${RELEASE_VERSION#v}"
        go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest
        git-chglog --next-tag "$tag" -o CHANGELOG.md
        git add CHANGELOG.md
        git commit -m "Prepare $tag release"
        git tag -a "$tag" -m "bterm $tag"

  push-release:
    desc: Atomically push the current branch and release tag (VERSION=0.2.0)
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: "{{.VERSION}}"
    cmds:
      - |
        tag="v${RELEASE_VERSION#v}"
        git push --atomic origin HEAD "$tag"

  clean-runs:
    desc: Delete GitHub workflow runs that failed or are older than DAYS days, default 7 (requires gh)
    silent: true
    vars:
      DAYS: '{{.DAYS | default "7"}}'
    cmds:
      - |
        set -e
        cutoff=$(date -u -d "{{.DAYS}} days ago" +%F)
        {
          gh api --paginate "repos/{owner}/{repo}/actions/runs?created=<$cutoff" --jq '.workflow_runs[].id'
          gh api --paginate "repos/{owner}/{repo}/actions/runs?status=failure" --jq '.workflow_runs[].id'
        } | sort -u |
          xargs -r -I{} gh api -X DELETE "repos/{owner}/{repo}/actions/runs/{}"

  hooks:
    desc: Install lefthook git hooks (installs lefthook)
    cmds:
      - go install github.com/evilmartians/lefthook@v1.12.0
      - lefthook install
